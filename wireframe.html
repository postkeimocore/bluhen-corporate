   8px base grid. Typography: 16 / 24 / 32 / 40 / 56 / 64 px.
   Text: #111111 on light surfaces, #ffffff on blue/dark surfaces.

:root{
 --unit:8px;--space-1:8px;--space-2:16px;--space-3:24px;--space-4:32px;--space-5:40px;
 --space-6:48px;--space-8:64px;--space-10:80px;--space-12:96px;--space-16:128px;
 --paper:#f8f8f5;--white:#ffffff;--pale:#eaf0f8;--blue:#34578a;--deep:#244574;
 --ink:#111111;--rule:rgba(17,17,17,.22);--white-rule:rgba(255,255,255,.5);
 --font:&quot;Satoshi&quot;,&quot;LINE Seed JP_OTF&quot;,&quot;LINE Seed JP&quot;,&quot;LINESeedJP&quot;,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif;
 --container:1280px;--cols:12;--gap:24px;--bar:56px;--nav:80px;
 --text:16px;--card:24px;--section-title:40px;--page-title:56px;--hero-title:64px;
}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:160px}

a,button{font:inherit;color:inherit}a{text-decoration:none}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #0d70ff;outline-offset:4px}button{border:0}p,h1,h2,h3,h4{margin:0}ul{padding:0;margin:0;list-style:none}
main{max-width:1440px;margin:auto;background:var(--paper);position:relative;min-height:100vh;box-shadow:0 8px 56px rgba(0,0,0,.12)}
.frame{width:calc(100% - 160px);max-width:var(--container);margin-inline:auto}
.grid-12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.page{display:none}.page.is-active{display:block}
/* REVIEW UI */
.review-bar{background:#111;color:#fff;min-height:var(--bar);display:flex;align-items:center;gap:24px;padding:8px max(24px,calc((100vw - 1360px)/2));position:sticky;top:0;z-index:100;border-bottom:1px solid #fff}

.review-label{font-size:16px;white-space:nowrap}
/* GRID OVERLAY */
.debug-grid{display:none;position:fixed;pointer-events:none;inset:calc(var(--bar) + var(--nav)) max(24px,calc((100vw - 1280px)/2)) 0;z-index:90;background-image:repeating-linear-gradient(to bottom,rgba(21,81,156,.17),rgba(21,81,156,.17) 1px,transparent 1px,transparent 8px)}
.show-grid .debug-grid{display:block}
/* SITE HEADER */
.site-header{height:var(--nav);position:sticky;top:var(--bar);z-index:80;background:var(--paper);border-bottom:1px solid var(--rule)}
.site-header-inner{height:100%;display:flex;align-items:center;gap:32px}
.wordmark{display:flex;flex-direction:column;justify-content:center;flex-shrink:0;min-width:160px;gap:4px}

.wordmark span{font-size:16px;line-height:24px;font-weight:600;white-space:nowrap}
.site-menu{display:flex;align-items:center;gap:24px;margin-left:auto}
.site-menu button{padding:16px 0;background:transparent;border-bottom:2px solid transparent;font-size:16px;font-weight:650;white-space:nowrap}

.rule-white{height:1px;background:var(--white-rule);width:100%}

.section{padding-block:var(--space-12)}
.section--white{background:var(--white)}
.section--paper{background:var(--paper)}
.section--pale{background:var(--pale)}
.section--blue{background:var(--blue);color:var(--white)}
.section--deep{background:var(--deep);color:var(--white)}
.section-title-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start;margin-bottom:48px}
.section-title-row&gt;.section-index{grid-column:span 3;padding-top:16px}
.section-title-row&gt;.section-copy{grid-column:span 9}

.section-copy .text-lead{max-width:850px}

.button-line .arr{font-size:24px;line-height:24px}
.button-solid{display:inline-flex;align-items:center;justify-content:space-between;gap:56px;padding:24px 32px;background:var(--white);color:var(--ink);font-size:16px;font-weight:750;min-width:256px;line-height:24px}

/* HERO — one planned hierarchy and one graphic system */
.hero{padding:112px 0 96px;min-height:792px;position:relative;overflow:hidden}

.statement-panel{grid-column:4 / span 9}
.statement-panel h2{font-size:40px;line-height:56px;max-width:850px}

.business-list{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--white-rule);border-bottom:1px solid var(--white-rule)}

.business-item+ .business-item{padding-left:40px;border-left:1px solid var(--white-rule)}

.diagram-panel{background:var(--white);border:1px solid var(--rule);padding:32px;margin-top:48px}
.diagram-panel-head{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:24px;border-bottom:1px solid var(--rule)}

.diagram-explanation{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;border-top:1px solid var(--rule);padding-top:32px}

.metric-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule);margin-top:48px}
.metric{padding:24px 24px 32px 0;min-height:264px}
.metric+.metric{border-left:1px solid var(--rule);padding-left:24px}

.about-cell{padding:32px;background:var(--white);border:1px solid var(--rule);min-height:168px}

.cta-stage{padding:96px 0;background:var(--blue);color:var(--white)}

/* ==================== v0.7 / TYPOGRAPHY &amp; SPATIAL SYSTEM ====================
   Fonts: Zen Kaku Gothic New (JP) / DM Sans (Latin)
   Weights: 400 body, 500 heading &amp; controls, 700 first-view statement only.
   Rhythm: an 8px base grid, with deliberate text-column and negative space.
   Brand colors remain provisional; editorial system is consistent across pages.
*/
:root {
  --font-en: &quot;DM Sans&quot;, Arial, sans-serif;
  --font-jp: &quot;Zen Kaku Gothic New&quot;, &quot;Hiragino Kaku Gothic ProN&quot;, &quot;Noto Sans JP&quot;, sans-serif;
  --font: &quot;DM Sans&quot;, &quot;Zen Kaku Gothic New&quot;, &quot;Hiragino Kaku Gothic ProN&quot;, sans-serif;
  --weight-body: 400;
  --weight-medium: 500;
  --weight-display: 700;
  --space-section: 128px;
  --section-heading-width: 800px;
  --copy-width: 624px;
}
html {font-synthesis: none;}
body {font-family:var(--font);font-weight:var(--weight-body);line-height:2;}
h1,h2,h3,h4 {font-family:var(--font);font-weight:var(--weight-medium);letter-spacing:.01em;overflow-wrap:break-word;}
h1 {font-size:64px;line-height:80px;}
h2 {font-size:40px;line-height:64px;letter-spacing:.015em;}
h3 {font-size:24px;line-height:40px;letter-spacing:.01em;}
h4 {font-size:16px;line-height:32px;letter-spacing:0;}
p {font-weight:var(--weight-body);letter-spacing:.005em;}
strong,b {font-weight:var(--weight-medium);}
button,a {font-weight:var(--weight-medium);}
button {letter-spacing:.005em;}
.text-body {font-size:16px;line-height:32px;font-weight:400;letter-spacing:.005em;}
.text-lead {font-size:24px;line-height:40px;font-weight:500;letter-spacing:0;}
.text-note,.meta {font-size:16px;line-height:32px;font-weight:400;letter-spacing:0;}
.roman,.micro-title {font-family:var(--font-en);font-size:16px;line-height:24px;letter-spacing:.06em;font-weight:500;}
.section-index,.tag {font-size:16px;line-height:24px;font-weight:500;letter-spacing:.015em;}
.section-index {gap:16px;}
.section-index:before{width:16px;height:1px;flex-shrink:0;}
.review-name {font-family:var(--font-en);font-weight:500;}
.review-tab,.grid-toggle {font-family:var(--font);font-size:16px;font-weight:500;}
.wordmark strong {font-family:var(--font-en);font-weight:600;letter-spacing:-.025em;}
.wordmark span {font-family:var(--font);font-weight:400;}
.site-menu {gap:24px;}
.site-menu button {font-weight:500;font-size:16px;letter-spacing:0;border-bottom-width:1px;}
.site-menu .contact-link {padding:16px 24px;}
.lang {font-family:var(--font-en);font-weight:500;font-size:16px;}
.mobile-toggle {font-weight:500;}
/* A spacious composition where the right side intentionally remains clear. */
.section {padding-block:var(--space-section);}
.section-title-row {margin-bottom:64px;column-gap:24px;}
.section-title-row &gt; .section-index {padding-top:16px;}
.section-title-row &gt; .section-copy {grid-column:span 9;min-width:0;}
.section-copy h2 {max-width:var(--section-heading-width);font-size:40px;line-height:64px;font-weight:500;letter-spacing:.015em;}
.section-copy p {max-width:var(--copy-width);margin-top:32px;}
/* All-body label hierarchy stays legible with black or white text. */
.button-line {padding:16px 0;gap:40px;border-bottom-width:1px;font-size:16px;font-weight:500;}
.button-solid {font-size:16px;font-weight:500;padding:24px 32px;}
.outline-chip {font-weight:500;}
.note-box strong {font-weight:500;}
/* TOP: genuine headline emphasis belongs in the hero alone. */
.hero {padding:128px 0 120px;min-height:824px;}
.hero-layout {min-height:568px;align-items:center;}
.hero-left {grid-column:span 7;}
.hero-right {grid-column:span 5;}
.hero h1 {font-family:var(--font-jp);font-size:64px;line-height:88px;font-weight:700;letter-spacing:.005em;max-width:none;}
.hero h1 .line2 {padding-left:48px;}
.hero-overline {font-family:var(--font-en);margin-top:32px;font-size:16px;line-height:24px;font-weight:500;letter-spacing:.10em;opacity:1;}
.hero-art {max-width:680px;transform:translateX(32px);}
/* Editorial statement: an anchored left index and restrained copy width. */
#top-statement {padding-top:160px;padding-bottom:160px;}
.statement-panel {grid-column:4 / span 8;}
.statement-panel h2 {font-size:40px;line-height:64px;font-weight:500;letter-spacing:.015em;max-width:800px;}
.statement-panel .statement-note {margin-top:40px;max-width:624px;}
/* Business panels don&#x27;t need artificial typographic weight. */
#top-business {padding-top:144px;padding-bottom:144px;}

&lt;div class=&quot;page&quot; data-page=&quot;about&quot;&gt;&lt;section class=&quot;interior-hero section--paper&quot;&gt;&lt;div class=&quot;frame interior-hero-grid&quot;&gt;&lt;div class=&quot;interior-hero-copy&quot;&gt;&lt;div class=&quot;section-index&quot;&gt;01 / ABOUT&lt;/div&gt;&lt;h1&gt;Bluhenについて&lt;/h1&gt;&lt;p class=&quot;text-body&quot;&gt;Bluhenは、日本企業のグローバル展開を支援するコミュニケーションデザインの会社です。ブランド戦略と英文IRを中心に、企業の価値を伝えるための言葉と表現を設計します。&lt;/p&gt;&lt;p class=&quot;editorial-english&quot; lang=&quot;en&quot;&gt;We shape how brands communicate across cultures and markets.&lt;/p&gt;&lt;/div&gt;&lt;div aria-hidden=&quot;true&quot; class=&quot;interior-hero-art&quot;&gt;&lt;div class=&quot;orbit orbit-one&quot;&gt;&lt;/div&gt;&lt;div class=&quot;orbit orbit-two&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;section section--white&quot;&gt;&lt;div class=&quot;frame&quot;&gt;&lt;div class=&quot;section-title-row&quot;&gt;&lt;div class=&quot;section-index&quot;&gt;02 / 方針&lt;/div&gt;&lt;div class=&quot;section-copy&quot;&gt;&lt;h2&gt;事業を通じた社会への取り組み&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;editorial-feature&quot;&gt;&lt;div class=&quot;editorial-feature-copy&quot;&gt;&lt;p class=&quot;text-lead&quot;&gt;ブリューエンは、事業活動と日々の働き方を通じて、持続可能な社会の実現に取り組んでいます。&lt;/p&gt;&lt;p class=&quot;text-body&quot;&gt;経済・社会・環境の3つの観点から、人材の活躍機会、柔軟な働き方、資源や環境への配慮を具体的な活動につなげています。&lt;/p&gt;&lt;span class=&quot;editorial-english&quot; lang=&quot;en&quot;&gt;People, society and environment.&lt;/span&gt;&lt;/div&gt;&lt;div aria-label=&quot;サステナビリティの取り組みを紹介する写真エリア&quot; class=&quot;editorial-image-panel editorial-image-panel--sustainability&quot;&gt;&lt;div aria-hidden=&quot;true&quot; class=&quot;editorial-image-art&quot;&gt;&lt;div class=&quot;editorial-image-circle&quot;&gt;&lt;/div&gt;&lt;div class=&quot;editorial-image-plane&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;image-panel-label&quot;&gt;SUSTAINABILITY&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;div class=&quot;sdg-items&quot;&gt;&lt;article&gt;&lt;span class=&quot;sdg-symbol&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;roman&quot;&gt;ECONOMY&lt;/span&gt;&lt;h3&gt;人材・地域経済&lt;/h3&gt;&lt;p class=&quot;text-body&quot;&gt;通訳・英語などのスキルアップ講座を開催しています。また、グローバル人材と中小企業をつなぐNEXT VISAを通じて、人手不足の解消と多様な人材の活躍を後押ししています。&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;sdg-symbol&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;roman&quot;&gt;SOCIETY&lt;/span&gt;&lt;h3&gt;仕事と生活の両立&lt;/h3&gt;&lt;p class=&quot;text-body&quot;&gt;子育てと仕事を両立できる環境づくりに向けて、リモートワーク・フルフレックスを採用。完全在宅勤務や、子どもを同伴した会議への参加ができる体制を整えています。&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;sdg-symbol&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;roman&quot;&gt;ENVIRONMENT&lt;/span&gt;&lt;h3&gt;資源・環境への配慮&lt;/h3&gt;&lt;p class=&quot;text-body&quot;&gt;資料の共有にはクラウドを利用し、ペーパーレス化を推進しています。また、事業所の内装には環境に配慮した製品を使用しています。&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section section--white&quot;&gt;&lt;div class=&quot;frame&quot;&gt;&lt;div class=&quot;section-title-row&quot;&gt;&lt;div class=&quot;section-index&quot;&gt;04 / 関連情報&lt;/div&gt;&lt;div class=&quot;section-copy&quot;&gt;&lt;h2&gt;関連する事業・制度&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;services-grid&quot;&gt;&lt;article class=&quot;service-tile&quot;&gt;&lt;h3&gt;NEXT VISA&lt;/h3&gt;&lt;p class=&quot;text-body&quot;&gt;外国人材と企業との接点をつくり、多様な働き手の活躍を支援する事業です。&lt;/p&gt;&lt;button class=&quot;button-line&quot; data-go=&quot;work&quot;&gt;事業一覧へ &lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;&lt;/button&gt;&lt;/article&gt;&lt;article class=&quot;service-tile&quot;&gt;&lt;h3&gt;Bluhenの働く環境&lt;/h3&gt;&lt;p class=&quot;text-body&quot;&gt;さまざまなライフステージの人材が関われる組織づくりに取り組んでいます。&lt;/p&gt;&lt;button class=&quot;button-line&quot; data-go=&quot;recruit&quot;&gt;採用情報へ &lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;&lt;/button&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;/div&gt;
&lt;div class=&quot;page&quot; data-page=&quot;recruit&quot;&gt;&lt;section class=&quot;interior-hero section--paper&quot;&gt;&lt;div class=&quot;frame interior-hero-grid&quot;&gt;&lt;div class=&quot;interior-hero-copy&quot;&gt;&lt;div class=&quot;section-index&quot;&gt;01 / RECRUIT&lt;/div&gt;&lt;h1&gt;採用情報&lt;/h1&gt;&lt;p class=&quot;text-body&quot;&gt;リモートワークや柔軟な働き方を取り入れ、経験や専門性の異なるメンバーが事業に取り組んでいます。&lt;/p&gt;&lt;p class=&quot;editorial-english&quot; lang=&quot;en&quot;&gt;Different backgrounds. One team.&lt;/p&gt;&lt;/div&gt;&lt;div aria-hidden=&quot;true&quot; class=&quot;interior-hero-art&quot;&gt;&lt;div class=&quot;orbit orbit-one&quot;&gt;&lt;/div&gt;&lt;div class=&quot;orbit orbit-two&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;div class=&quot;editorial-feature editorial-feature--reverse&quot;&gt;&lt;div aria-label=&quot;チームや日々の仕事の様子を掲載する写真エリア&quot; class=&quot;editorial-image-panel editorial-image-panel--recruit&quot;&gt;&lt;div aria-hidden=&quot;true&quot; class=&quot;editorial-image-art&quot;&gt;&lt;div class=&quot;editorial-image-circle&quot;&gt;&lt;/div&gt;&lt;div class=&quot;editorial-image-plane&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;image-panel-label&quot;&gt;PEOPLE &amp;amp; CULTURE&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;editorial-feature-copy&quot;&gt;&lt;span class=&quot;roman&quot;&gt;OUR WORK STYLE&lt;/span&gt;&lt;p class=&quot;text-lead&quot;&gt;それぞれの経験を活かし、案件に応じたチームで働く。&lt;/p&gt;&lt;p class=&quot;text-body&quot;&gt;Bluhenでは企画、デザイン、翻訳、海外事業などの経験を持つメンバーが協働しています。担当領域や働く場所が異なっても、案件ごとに必要な専門性を持ち寄ります。&lt;/p&gt;&lt;p class=&quot;text-body&quot;&gt;リモートワーク・フルフレックスを取り入れ、ライフステージに合わせた柔軟な働き方を大切にしています。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;section section--white&quot; id=&quot;recruit-workstyle&quot;&gt;&lt;div class=&quot;frame&quot;&gt;&lt;div class=&quot;section-title-row&quot;&gt;&lt;div class=&quot;section-index&quot;&gt;働き方&lt;/div&gt;&lt;div class=&quot;section-copy&quot;&gt;&lt;h2&gt;Bluhenの働き方&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;recruit-style-grid&quot;&gt;&lt;article&gt;&lt;span class=&quot;roman&quot;&gt;01 / REMOTE&lt;/span&gt;&lt;h3&gt;リモートワーク&lt;/h3&gt;&lt;p class=&quot;text-body&quot;&gt;働く場所にとらわれず、地域や生活環境の異なるメンバーが仕事に参加しています。&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;roman&quot;&gt;02 / FLEXIBLE&lt;/span&gt;&lt;h3&gt;フルフレックス&lt;/h3&gt;&lt;p class=&quot;text-body&quot;&gt;家庭や生活との両立を考え、時間の使い方に柔軟性を持たせています。&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;roman&quot;&gt;03 / SKILLS&lt;/span&gt;&lt;h3&gt;専門性を活かす仕事&lt;/h3&gt;&lt;p class=&quot;text-body&quot;&gt;これまでのキャリアで身につけたスキルや経験を、担当する事業・業務に活かします。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;div class=&quot;page&quot; data-page=&quot;knowledge&quot;&gt;&lt;section class=&quot;interior-hero section--paper&quot;&gt;&lt;div class=&quot;frame interior-hero-grid&quot;&gt;&lt;div class=&quot;interior-hero-copy&quot;&gt;&lt;div class=&quot;section-index&quot;&gt;01 / KNOWLEDGE&lt;/div&gt;&lt;h1&gt;ナレッジ&lt;/h1&gt;&lt;p class=&quot;text-body&quot;&gt;海外市場に向けたブランド戦略、言葉や文化に合わせた表現、英文IRの品質管理について、実務に即した考え方を紹介します。&lt;/p&gt;&lt;/div&gt;&lt;div aria-hidden=&quot;true&quot; class=&quot;interior-hero-art&quot;&gt;&lt;div class=&quot;orbit orbit-one&quot;&gt;&lt;/div&gt;&lt;div class=&quot;orbit orbit-two&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;div class=&quot;knowledge-archive&quot; data-filter-items=&quot;knowledge&quot;&gt;&lt;button class=&quot;knowledge-tile&quot; data-article-id=&quot;0&quot; data-go=&quot;knowledge-detail&quot; data-type=&quot;brand&quot;&gt;&lt;span class=&quot;tile-art&quot;&gt;&lt;span class=&quot;roman&quot;&gt;BRAND STRATEGY&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot; class=&quot;tile-art-circle&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;tile-text&quot;&gt;&lt;span class=&quot;roman&quot;&gt;BRAND STRATEGY&lt;/span&gt;&lt;strong&gt;商品価値を海外市場で伝えるためのブランドコンセプト設計&lt;/strong&gt;&lt;span class=&quot;text-body&quot;&gt;対象市場と商品の特徴を踏まえ、ブランドの核となる言葉を整理する方法。&lt;/span&gt;&lt;span class=&quot;tile-action&quot;&gt;記事を読む →&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;knowledge-tile&quot; data-article-id=&quot;1&quot; data-go=&quot;knowledge-detail&quot; data-type=&quot;brand&quot;&gt;&lt;span class=&quot;tile-art&quot;&gt;&lt;span class=&quot;roman&quot;&gt;LANGUAGE &amp;amp; CULTURE&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot; class=&quot;tile-art-circle&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;tile-text&quot;&gt;&lt;span class=&quot;roman&quot;&gt;LANGUAGE &amp;amp; CULTURE&lt;/span&gt;&lt;strong&gt;翻訳とトランスクリエーションの違い&lt;/strong&gt;&lt;span class=&quot;text-body&quot;&gt;現地の文化や生活者に合わせた言葉の設計を考えます。&lt;/span&gt;&lt;span class=&quot;tile-action&quot;&gt;記事を読む →&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;knowledge-tile&quot; data-article-id=&quot;2&quot; data-go=&quot;knowledge-detail&quot; data-type=&quot;ir&quot;&gt;&lt;span class=&quot;tile-art&quot;&gt;&lt;span class=&quot;roman&quot;&gt;GLOBAL IR&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot; class=&quot;tile-art-circle&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;tile-text&quot;&gt;&lt;span class=&quot;roman&quot;&gt;GLOBAL IR&lt;/span&gt;&lt;strong&gt;IR翻訳に求められる正確性と文脈理解&lt;/strong&gt;&lt;span class=&quot;text-body&quot;&gt;財務・経営情報を海外の読み手に伝えるための観点。  const archiveArticleData=[{&quot;category&quot;: &quot;BRAND STRATEGY&quot;, &quot;title&quot;: &quot;商品価値を海外市場で伝えるためのブランドコンセプト設計&quot;, &quot;intro&quot;: &quot;日本で評価されている商品でも、海外市場では同じ説明がそのまま響くとは限りません。対象市場で伝える価値を整理するための考え方を紹介します。&quot;, &quot;sections&quot;: [[&quot;商品の特徴と価値を分ける&quot;, &quot;商品の機能や素材、製造方法は重要な情報です。一方、それだけで生活者に選ばれる理由になるとは限りません。誰にとってどんな意味があるのかを整理します。&quot;], [&quot;対象市場の文脈を把握する&quot;, &quot;日本の市場で前提となっている習慣や認識は、国や地域によって異なります。生活習慣や競合商品との比較を通して、伝えるべきポイントを検討します。&quot;], [&quot;コンセプトと言葉に落とす&quot;, &quot;商品の特徴、企業の考え方、市場の文脈を踏まえてコンセプトを整理します。コピーやビジュアル、Webサイトを制作する際の判断基準となるよう、表現方針を明確にします。&quot;]], &quot;business&quot;: &quot;bm&quot;}, {&quot;category&quot;: &quot;LANGUAGE &amp; CULTURE&quot;, &quot;title&quot;: &quot;翻訳とトランスクリエーションの違い&quot;, &quot;intro&quot;: &quot;言葉の意味を正しく訳すことと、ブランドの価値を市場に適した形で伝えることは、必ずしも同じではありません。&quot;, &quot;sections&quot;: [[&quot;翻訳で守るもの&quot;, &quot;まず原文が伝えている情報と意図を把握し、その意味を損なわない形で別の言語に置き換えます。&quot;], [&quot;文化や購買文脈を踏まえた表現&quot;, &quot;現地の消費者にとって自然な説明や訴求方法を検討します。ブランドの特徴は維持しながら、言い回しを調整することがあります。&quot;], [&quot;判断するための共通方針&quot;, &quot;直訳にするか表現を変えるかは、何を伝えるかというブランドの方針に沿って判断します。&quot;]], &quot;business&quot;: &quot;bm&quot;}, {&quot;category&quot;: &quot;GLOBAL IR&quot;, &quot;title&quot;: &quot;IR翻訳に求められる正確性と文脈理解&quot;, &quot;intro&quot;: &quot;IR情報の英文制作では、単語の正しさに加え、財務情報や経営戦略の意味が誤解なく伝わることが重要です。&quot;, &quot;sections&quot;: [[&quot;IR文書の内容を理解する&quot;, &quot;事業内容、経営方針、数値の位置づけなど、文章の背景を理解してから翻訳・編集を進めます。&quot;], [&quot;用語と情報の整合性&quot;, &quot;同じ概念を指す用語、前後の数値、他の開示文書との整合性を確認します。&quot;], [&quot;翻訳後の専門レビュー&quot;, &quot;翻訳者とは別の担当者が内容と表現を確認することで、見落としや誤解を防ぐ体制を整えます。&quot;]], &quot;business&quot;: &quot;ir&quot;}, {&quot;category&quot;: &quot;EDITORIAL&quot;, &quot;title&quot;: &quot;統合報告書の英文編集で確認したい用語と表現&quot;, &quot;intro&quot;: &quot;統合報告書は財務情報だけでなく、経営方針や持続可能性に関する説明を含むため、全体を通じた一貫性が求められます。&quot;, &quot;sections&quot;: [[&quot;重要語句の整理&quot;, &quot;経営方針、事業名称、指標の名称は使用する英文表現を統一します。&quot;], [&quot;数値と記述の対応&quot;, &quot;数値の単位、対象期間、図表の参照先と本文の説明に食い違いがないか確認します。&quot;], [&quot;文書全体のトーン&quot;, &quot;複数の担当者が執筆・翻訳しても読み手が違和感を覚えないよう、表現を整えます。&quot;]], &quot;business&quot;: &quot;ir&quot;}, {&quot;category&quot;: &quot;GLOBAL BRANDING&quot;, &quot;title&quot;: &quot;海外市場でのブランドメッセージの組み立て方&quot;, &quot;intro&quot;: &quot;海外向けのメッセージは、商品の特徴だけでなく、その市場の生活者にとっての意味を踏まえて考えます。&quot;, &quot;sections&quot;: [[&quot;誰に伝えるのか&quot;, &quot;対象となる顧客像と利用場面を把握し、伝える相手を具体化します。&quot;], [&quot;何を価値として示すのか&quot;, &quot;商品の機能、素材、開発背景などを整理し、選ばれる理由を検討します。&quot;], [&quot;どう表現するのか&quot;, &quot;言葉とビジュアルが同じコンセプトを伝えるよう、表現方針を設計します。&quot;]], &quot;business&quot;: &quot;bm&quot;}, {&quot;category&quot;: &quot;EXECUTIVE COMMUNICATION&quot;, &quot;title&quot;: &quot;経営者メッセージを英語で伝える&quot;, &quot;intro&quot;: &quot;経営者メッセージを英文化する際には、発言の意図と経営方針を正確に理解することが重要です。&quot;, &quot;sections&quot;: [[&quot;メッセージの目的&quot;, &quot;何を投資家やステークホルダーへ伝える文章なのかを把握します。&quot;], [&quot;経営上の言葉遣い&quot;, &quot;意思決定や方針を示す表現が、別の意味に受け取られないよう慎重に編集します。&quot;], [&quot;専門家による確認&quot;, &quot;英文の自然さだけでなく、財務・経営の文脈も含めて内容を確認します。&quot;]], &quot;business&quot;: &quot;ir&quot;}];

<script>
(() => {
 const app=document.getElementById('preview-app');
 const iframe=document.getElementById('site-preview-frame');
 const toggle=document.getElementById('side-toggle');
 const grid=document.getElementById('grid-toggle');
 const links=[...document.querySelectorAll('[data-sidebar-page]')];
 const addr=document.getElementById('preview-address');
 const routes={'top':'/','bm':'/work/global-branding-marketing/','ir':'/work/global-ir/','work':'/work/','about':'/about/','sdgs':'/sdgs/','recruit':'/recruit/','knowledge':'/knowledge/','knowledge-detail':'/knowledge/{slug}/','news':'/news/','news-detail':'/news/{slug}/','contact':'/contact/','sitemap':'/sitemap-preview/'};
 function choose(page,notify=true){
    links.forEach(link=>{const active=link.dataset.sidebarPage===page;link.classList.toggle('is-current',active);link.setAttribute('aria-current',active?'page':'false');});
    addr.textContent='https://bluhen.org'+(routes[page]||'/');
    const u=new URL(location.href);u.searchParams.set('page',page);history.replaceState(null,'',u);
    if(notify)iframe.contentWindow?.postMessage({type:'bluhen:navigate',page},'*');
 }
 links.forEach(link=>link.addEventListener('click',()=>{choose(link.dataset.sidebarPage);if(innerWidth<=900){app.classList.add('is-collapsed');toggle.setAttribute('aria-expanded','false');toggle.textContent='ナビを表示';}}));
 toggle.addEventListener('click',()=>{const closed=app.classList.toggle('is-collapsed');toggle.setAttribute('aria-expanded',String(!closed));toggle.textContent=closed?'ナビを表示':'ナビを隠す';});
 grid.addEventListener('click',()=>{const on=grid.getAttribute('aria-pressed')!=='true';grid.setAttribute('aria-pressed',String(on));iframe.contentWindow?.postMessage({type:'bluhen:grid',enabled:on},'*');});
 window.addEventListener('message',event=>{if(event.source!==iframe.contentWindow||!event.data||event.data.type!=='bluhen:page')return;choose(event.data.page,false);});
 iframe.addEventListener('load',()=>{const page=new URLSearchParams(location.search).get('page')||'top';choose(page);if(grid.getAttribute('aria-pressed')==='true')iframe.contentWindow?.postMessage({type:'bluhen:grid',enabled:true},'*');});
 if(innerWidth<=900){app.classList.add('is-collapsed');toggle.setAttribute('aria-expanded','false');toggle.textContent='ナビを表示';}
})();
